<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>2026 수학여행 실시간 일정</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#111318;--card:#1b1e25;--card2:#232731;--line:#323846;--txt:#e9ecf2;--sub:#9aa3b5;--blue:#5b8def;--blue2:#2f5fd0;--green:#3ddc97;--amber:#ffb547;--red:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
header.top{position:sticky;top:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px}
header .title{font-size:18px;font-weight:700}
header .clock{font-size:12px;color:var(--sub)}
main{max-width:720px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:14px;color:var(--sub);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--blue2);border-color:var(--blue);font-weight:700}
.resolved{font-size:13px;color:var(--sub);background:#14171d;border-radius:10px;padding:8px 10px}
.resolved b{color:var(--txt)}
.btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;padding:6px 10px;font-size:13px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--blue2);border-color:var(--blue)}
.btn.danger{border-color:#7a2f2f;color:#ffb0b0}
.btn.on{background:var(--amber);color:#222;border-color:var(--amber);font-weight:700}
/* now card */
.now{border-color:#2d4a8a;background:linear-gradient(160deg,#1c2640,#1b1e25 70%)}
.now .lbl{font-size:12px;color:var(--green);font-weight:700;letter-spacing:.5px}
.now .big{font-size:20px;font-weight:800;margin:4px 0}
.now .meta{font-size:13px;color:var(--sub)}
.bar{height:8px;background:#2a2f3a;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .5s}
.next{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.next span{color:var(--sub);font-size:12px}
/* tabs */
#tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 12px;padding-bottom:2px}
#tabs button{flex:1 0 auto;border:0;border-radius:999px;padding:9px 14px;background:#3a3f4b;color:#cfd5e1;font-weight:700;font-size:14px;cursor:pointer;position:relative}
#tabs button.on{background:var(--blue2);color:#fff}
#tabs button .today{position:absolute;top:-4px;right:-2px;background:var(--green);color:#062;font-size:10px;border-radius:6px;padding:1px 5px}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dayhead .d{font-size:18px;font-weight:800}
.meal{font-size:12px;color:var(--amber);background:#2b2214;border-radius:8px;padding:4px 8px}
.daynote{font-size:13px;color:#ff9a8a;margin:6px 0 4px}
.grouptag{font-size:13px;color:var(--sub);margin-bottom:10px}
.grouptag b{color:var(--blue)}
/* timeline */
.seg{position:relative;padding-left:34px}
.rail{position:absolute;left:12px;top:0;bottom:0;width:4px;background:#2f3440}
.rail .fill{position:absolute;left:0;top:0;width:100%;background:var(--blue);transition:height .5s}
.seg.current .rail .fill{background:linear-gradient(var(--blue),var(--green))}
.dot{position:absolute;left:5px;top:18px;width:18px;height:18px;border-radius:50%;background:#2f3440;border:3px solid var(--bg);z-index:2}
.seg.done .dot{background:var(--blue)}
.seg.current .dot{background:var(--green);box-shadow:0 0 0 0 rgba(61,220,151,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.seg:first-child .rail{top:20px}
.seg:last-child .rail{bottom:auto;height:22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 0 10px}
.seg.done .box{opacity:.55}
.seg.current .box{border-color:var(--green);background:#16261f}
.time{font-size:13px;color:#8fb4ff;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dur{color:var(--sub);font-weight:500;font-size:12px}
.badge{font-size:11px;border-radius:6px;padding:1px 6px;font-weight:800}
.badge.now{background:var(--green);color:#063}
.badge.done{background:#333a48;color:#aab}
.ttl{font-size:16px;font-weight:700;margin:3px 0}
.note{font-size:13px;color:var(--sub)}
.place{font-size:12px;color:var(--sub)}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{height:5px;background:#2a2f3a;border-radius:9px;overflow:hidden;margin-top:8px}
.mini>div{height:100%;background:var(--green)}
.remain{font-size:12px;color:var(--green);margin-top:3px;font-weight:700}
/* travel */
.seg.travel .rail{background:repeating-linear-gradient(#2f3440 0 6px,transparent 6px 10px)}
.seg.travel.done .rail,.seg.travel .rail .fill{background:repeating-linear-gradient(var(--blue) 0 6px,transparent 6px 10px)}
.seg.travel .dot{width:12px;height:12px;left:8px;top:16px;border-width:2px}
.seg.travel .box{background:transparent;border:1px dashed var(--line);padding:8px 12px}
.seg.travel.current .box{border-color:var(--amber);background:#2a2314}
.seg.travel.current .dot{background:var(--amber);animation:none}
.travel .ttl{font-size:14px;color:#cfd5e1}
.edit-only{display:none}
body.editing .edit-only{display:inline-flex}
body.editing .box{border-style:dashed}
.addrow{width:100%;justify-content:center;padding:10px;margin-top:4px}
.tools .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tools input[type=datetime-local]{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
.editbar{display:none;background:var(--amber);color:#222;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
body.editing .editbar{display:block}
.links{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.linkbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:14px;background:linear-gradient(90deg,#2f5fd0,#4a7bf0);color:#fff;font-weight:800;font-size:16px;text-decoration:none;border:0}
.linkbtn.off{background:#2a2f3a;color:#7d8597;font-weight:600;font-size:14px;cursor:not-allowed}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;width:min(92vw,480px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tst{background:#fff;color:#111;border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:auto;animation:drop .3s}
.tst b{display:block;font-size:15px}.tst span{font-size:13px;color:#444}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
.sync{font-size:11px;color:var(--sub)}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:16px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 12px;font-size:17px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.f input[type=text],.f input[type=url],.f input[type=time],.f textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:15px;font-family:inherit}
.f .two{display:flex;gap:8px}.f .two>div{flex:1}
.hint{font-size:11px;color:var(--sub);margin-top:3px}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.chk{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div><div class="title">🧳 2026 수학여행</div><div class="clock" id="clock"></div><div class="sync" id="sync"></div></div>
  <button class="btn" id="editBtn">✏️ 일정 편집</button>
</header>
<main>
  <div class="editbar">편집 모드 · 일정을 눌러 수정하거나, 이동 구간에 길찾기 링크를 넣을 수 있어요. <span id="editSaveMsg"></span></div>
  <div class="links" id="links"></div>
  <section class="card" id="selector"></section>
  <section class="card now" id="now"></section>

  <section id="day"></section>

      <button class="btn danger" id="resetBtn">↺ 원래 일정으로 초기화</button>
    </div>
    <div class="row" style="margin-top:10px">
      <span style="font-size:13px;color:var(--sub)">⏱ 시간 테스트</span>
      <input type="datetime-local" id="simInput" min="2026-11-01T00:00" max="2026-11-06T23:59">
      <button class="btn" id="simOff">실시간으로</button>
    </div>
    <div class="hint">시간 테스트로 특정 시각을 넣으면 그 시각 기준으로 진행 상황을 미리 볼 수 있어요. (한국 시간 기준)</div>
  </section>
  <footer>출처: 2026학년도 2학년 수학여행 실시 계획 (창원북면고등학교)</footer>
</main>
<div id="toast"></div>
<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const hhmm=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const fmtDur=m=>{m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h?(h+'시간'+(r?' '+r+'분':'')):r+'분'};
const naverSearch=q=>'https://map.naver.com/p/search/'+encodeURIComponent(q);
const kakaoRoute=(a,b)=>'https://map.kakao.com/?sName='+encodeURIComponent(a)+'&eName='+encodeURIComponent(b);
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
function nowKST(){
  if(sim){const [d,t]=sim.split('T');return {date:d,m:toMin(t)}}
  const k=new Date(Date.now()+9*3600e3);
  return {date:k.toISOString().slice(0,10),m:k.getUTCHours()*60+k.getUTCMinutes()+k.getUTCSeconds()/60};
}
function groupFor(n){
  const d=DAYS[n-1];
  if(d.type==='course') return settings.course;
  if(settings.cls) return JIN1[n].includes(settings.cls)?'1':'2';
  return settings.jin;
}
function icon(t){
  if(/항공|✈/.test(t))return '';
  if(/중식|석식|조식/.test(t))return '🍽️ ';
  if(/숙소|호텔/.test(t))return '🏨 ';
  if(/공항/.test(t))return '🛫 ';
  if(/학교/.test(t))return '🏫 ';
  return '📍 ';
}

/* 일정 + 이동구간 생성 */
function segments(n){
  const g=groupFor(n);
  const its=data.items.filter(i=>i.day===n&&i.groups.includes(g))
    .sort((a,b)=>toMin(a.start)-toMin(b.start)||(a.end?toMin(a.end):9999)-(b.end?toMin(b.end):9999));
  const out=[];
  its.forEach((it,i)=>{
    const s=toMin(it.start), nx=its[i+1];
    let e=it.end?toMin(it.end):(nx?toMin(nx.start):24*60-1);
    if(e<s)e=s;
    out.push({kind:'item',it,s,e,open:!it.end,key:it.id});
    if(nx&&toMin(nx.start)>e){
      const key=n+'|'+it.id+'|'+nx.id;
      out.push({kind:'travel',from:it,to:nx,s:e,e:toMin(nx.start),key});
    }
  });
  return out;
}
function stateOf(n,seg,now){
  const date=DAYS[n-1].date;
  if(now.date>date)return {st:'done',pct:100};
  if(now.date<date)return {st:'up',pct:0};
  if(seg.e===seg.s)return now.m>=seg.s?{st:'done',pct:100}:{st:'up',pct:0};
  if(now.m>=seg.e)return {st:'done',pct:100};
  if(now.m>=seg.s)return {st:'current',pct:(now.m-seg.s)/(seg.e-seg.s)*100};
  return {st:'up',pct:0};
}
function segTitle(seg){return seg.kind==='item'?icon(seg.it.title)+seg.it.title:'🚌 이동중 → '+seg.to.title}
function timeTxt(seg){
  if(seg.kind==='travel')return hhmm(seg.s)+' – '+hhmm(seg.e);
  if(seg.open)return seg.it.start+' ~';
  if(seg.s===seg.e)return seg.it.start;
  return seg.it.start+' – '+seg.it.end;
}

function renderNow(){
  const now=nowKST(), first=DAYS[0].date, last=DAYS[DAYS.length-1].date;
  $('#clock').textContent=(sim?'🧪 테스트 ':'')+now.date.slice(5).replace('-','/')+' '+hhmm(Math.floor(now.m))+' (KST)';
  let h='';
  if(now.date<first){
    const s1=segments(1)[0];
    const dd=(new Date(first)-new Date(now.date))/864e5;
    const left=dd*1440+(s1?s1.s:0)-now.m;
    h=`<div class="lbl">⏳ 출발 전</div><div class="big">수학여행까지 ${fmtDur(left)} 남음</div>
       <div class="meta">첫 일정 · 11/2(월) ${s1?timeTxt(s1)+' '+esc(s1.it.title):''}</div>`;
  }else if(now.date>last){
    h=`<div class="lbl">🎉 종료</div><div class="big">수학여행이 모두 끝났어요</div><div class="meta">모두 수고했어요!</div>`;
  }else{
    const n=DAYS.find(d=>d.date===now.date).n, segs=segments(n);
    const cur=segs.find(s=>stateOf(n,s,now).st==='current');
    const ds=segs[0]?.s??0, de=segs.length?Math.max(...segs.map(s=>s.open?s.s:s.e)):1;
    const dayPct=Math.min(100,Math.max(0,(now.m-ds)/(de-ds)*100));
    const nxt=segs.find(s=>s.s>now.m||(cur&&s===segs[segs.indexOf(cur)+1]));
    if(cur){
      const st=stateOf(n,cur,now);
      h=`<div class="lbl">● 지금 진행 중 · 제${n}일</div><div class="big">${esc(segTitle(cur))}</div>
         <div class="meta">${timeTxt(cur)}${cur.open?'':' · '+fmtDur(cur.e-now.m)+' 남음'}</div>
         ${cur.open?'':`<div class="bar"><div style="width:${st.pct}%"></div></div>`}`;
    }else if(segs.length&&now.m<segs[0].s){
      h=`<div class="lbl">☀️ 제${n}일 · 일정 시작 전</div><div class="big">첫 일정까지 ${fmtDur(segs[0].s-now.m)}</div>`;
    }else{
      const nd=DAYS[n]; const ns=nd?segments(nd.n)[0]:null;
      h=`<div class="lbl">🌙 제${n}일 일정 종료</div><div class="big">오늘 일정 끝! 푹 쉬어요</div>`+

    }
    if(nxt&&nxt!==cur)h+=`<div class="next"><span>다음 일정 · ${fmtDur(nxt.s-now.m)} 후</span><br><b>${timeTxt(nxt)}</b> ${esc(segTitle(nxt))}</div>`;
    h+=`<div class="meta" style="margin-top:10px">오늘 진행률 ${Math.round(dayPct)}%</div><div class="bar"><div style="width:${dayPct}%"></div></div>`;
    if(cur)h+=`<button class="btn" style="margin-top:6px" id="goNow">⬇ 현재 일정으로 이동</button>`;
  }
  $('#now').innerHTML=h;
  const g=$('#goNow'); if(g)g.onclick=()=>{curDay=DAYS.find(d=>d.date===now.date).n;render();scrollCur()};
}

   <div class="f"><div class="two"><div><label>시작</label><input type="time" id="fStart" value="${it.start}"></div>
   <div><label>종료 (비우면 "~")</label><input type="time" id="fEnd" value="${it.end}"></div></div>
   <div class="hint">시작=종료로 두면 '출발' 같은 시점 일정이 돼요. 일정 사이 빈 시간은 자동으로 '이동중'이 됩니다.</div></div>
   <div class="f"><label>장소 (지도 검색어)</label><input type="text" id="fPlace" value="${esc(it.place)}" placeholder="예: 성산일출봉"></div>
   <div class="f"><label>지도 링크 (네이버지도·카카오맵 등 공유 링크)</label><input type="url" id="fMap" value="${esc(it.mapUrl)}" placeholder="https://naver.me/..."><div class="hint">비워두면 장소 이름으로 네이버지도 검색 링크가 자동 연결돼요.</div></div>
   <div class="f"><label>메모</label><input type="text" id="fNote" value="${esc(it.note)}" placeholder="예: 12시 예약, 공연 10:50"></div>
   <div class="f"><label>적용 대상</label>${opts.map(o=>`<label class="chk"><input type="checkbox" class="fG" value="${o}" ${it.groups.includes(o)?'checked':''}>${GROUP_DESC[n][o]}</label>`).join('')}</div>
   <div class="foot">${isNew?'<span></span>':'<button class="btn danger" id="fDel">🗑 삭제</button>'}
   <span><button class="btn" id="fCancel">취소</button> <button class="btn primary" id="fSave">저장</button></span></div>`);
  $('#fCancel').onclick=closeModal;
  if($('#fDel'))$('#fDel').onclick=()=>{if(confirm('이 일정을 삭제할까요?')){closeModal();commit({action:'deleteItem',id:it.id},()=>{data.items=data.items.filter(x=>x.id!==it.id)})}};
  $('#fSave').onclick=()=>{
    const t=$('#fTitle').value.trim(),s=$('#fStart').value,e=$('#fEnd').value,gs=[...document.querySelectorAll('.fG:checked')].map(x=>x.value);
    const m=$('#fMap').value.trim();
    if(!t||!s)return alert('일정 이름과 시작 시간을 입력해 주세요.');
    if(e&&toMin(e)<toMin(s))return alert('종료 시간이 시작 시간보다 빨라요.');
    if(!gs.length)return alert('적용 대상을 하나 이상 선택해 주세요.');
    if(m&&!safeUrl(m))return alert('링크는 http:// 또는 https:// 로 시작해야 해요.');
    const nv=Object.assign({},it,{title:t,start:s,end:e,place:$('#fPlace').value.trim(),mapUrl:m,note:$('#fNote').value.trim(),groups:gs});
    closeModal();
    commit({action:'upsertItem',item:nv},()=>{const i=data.items.findIndex(x=>x.id===nv.id);if(i<0)data.items.push(nv);else data.items[i]=nv});
  };
}
function travelModal(key){
  const seg=segments(curDay).find(s=>s.key===key); if(!seg)return;
  const tv=data.travel[key]||{url:'',note:''};
  openModal(`<h2>이동 구간 · ${hhmm(seg.s)}–${hhmm(seg.e)}</h2>
   <div class="note" style="margin-bottom:10px">${esc(seg.from.title)} → ${esc(seg.to.title)}</div>
   <div class="f"><label>길찾기 링크 (네이버지도 길찾기 공유 링크 등)</label><input type="url" id="tUrl" value="${esc(tv.url)}" placeholder="https://naver.me/...">
   <div class="hint">비워두면 출발지·도착지 이름으로 카카오맵 길찾기가 자동 연결돼요. 네이버지도 앱에서 길찾기 후 '공유 → 링크 복사'한 주소를 넣으면 그 경로가 열려요.</div></div>
   <div class="f"><label>메모</label><input type="text" id="tNote" value="${esc(tv.note)}" placeholder="예: 버스 탑승, 약 40분 소요"></div>
   <div class="foot"><button class="btn danger" id="tClear">링크·메모 지우기</button><span><button class="btn" id="tCancel">취소</button> <button class="btn primary" id="tSave">저장</button></span></div>`);
  $('#tCancel').onclick=closeModal;
  const label=seg.from.title+' → '+seg.to.title;
  $('#tClear').onclick=()=>{closeModal();commit({action:'setTravel',key,label,url:'',note:''},()=>{delete data.travel[key]})};
  $('#tSave').onclick=()=>{const u=$('#tUrl').value.trim();if(u&&!safeUrl(u))return alert('링크는 http:// 또는 https:// 로 시작해야 해요.');
    const nt=$('#tNote').value.trim();closeModal();commit({action:'setTravel',key,label,url:u,note:nt},()=>{data.travel[key]={url:u,note:nt}})};
}

/* ======================= 알림 ======================= */
const NKEY='trip2026_fired_v1';
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.6)}catch(e){}}
function toast(t,b){const el=document.createElement('div');el.className='tst';el.innerHTML=`<b>${esc(t)}</b><span>${esc(b)}</span>`;el.onclick=()=>el.remove();$('#toast').appendChild(el);setTimeout(()=>el.remove(),15000)}
async function notify(title,body){
  toast(title,body); beep(); try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{const reg=swReg||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());
      if(reg){await reg.showNotification(title,{body,tag:title,renotify:true,vibrate:[300,150,300]});return}}catch(e){}
  try{new Notification(title,{body})}catch(e){}
}
function checkAlarms(){
  if(!settings.notify||settings.push)return;   // 푸시를 받는 중이면 중복 방지
  const now=nowKST(), d=DAYS.find(x=>x.date===now.date); if(!d)return;
  const fired=load(NKEY)||{}, lead=settings.lead||0;
  segments(d.n).forEach(seg=>{
    if(seg.kind!=='item')return;
    const it=seg.it, where=it.place?' · '+it.place:'';
    const list=[[seg.s,'start','▶ 지금 시작: '+it.title,it.start+where+(it.note?' · '+it.note:'')]];
    if(lead>0)list.push([seg.s-lead,'pre','⏰ '+lead+'분 후: '+it.title,it.start+' 시작'+where]);
    list.forEach(([t,typ,ti,bo])=>{
      const k=now.date+'|'+it.id+'|'+typ+'|'+it.start+'|'+lead;
      if(now.m>=t&&now.m<t+3&&!fired[k]){fired[k]=1;notify(ti,bo)}
    });
  });
  localStorage.setItem(NKEY,JSON.stringify(fired));
}
async function toggleNotify(){
  if(settings.notify){settings.notify=false;saveS();render();return}
  if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
  settings.notify=true;saveS();render();
  toast('🔔 알림을 켰어요','일정 시작'+(settings.lead?'과 '+settings.lead+'분 전에':'할 때')+' 알려드릴게요.');
}
function buildICS(){
  const pad=s=>s.replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const utc=(date,m)=>new Date(new Date(date+'T00:00:00+09:00').getTime()+m*60000).toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z', lead=settings.lead||0;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//trip2026//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:2026 수학여행','X-WR-TIMEZONE:Asia/Seoul'];
  DAYS.forEach(d=>segments(d.n).forEach(seg=>{
    if(seg.kind!=='item')return; const it=seg.it;
    const map=safeUrl(it.mapUrl)||(it.place?naverSearch(it.place):'');
    L.push('BEGIN:VEVENT','UID:'+d.date+'-'+it.id+'@trip2026','DTSTAMP:'+stamp,'DTSTART:'+utc(d.date,seg.s),
      'DTEND:'+utc(d.date,seg.open?seg.s+30:seg.e),'SUMMARY:'+pad('[수학여행] '+it.title),
      'LOCATION:'+pad(it.place||''),'DESCRIPTION:'+pad([it.note,map].filter(Boolean).join('\n')),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+pad(it.title),'TRIGGER:'+(lead?'-PT'+lead+'M':'PT0M'),'END:VALARM','END:VEVENT');
  }));
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function downloadICS(){
  const who=settings.cls?settings.cls+'반':settings.jin+'진';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildICS()],{type:'text/calendar;charset=utf-8'}));
  a.download='수학여행_'+who+'_'+settings.course+'코스.ics';a.click();
  toast('📅 캘린더 파일을 받았어요','다운로드된 파일을 열어 캘린더에 추가하세요.');
}

/* ======================= 구글 시트 연동 ======================= */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function api(body){
  const r=body?await fetch(CONFIG.SHEET_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
              :await fetch(CONFIG.SHEET_API+'?t='+Date.now());
  const j=await r.json(); if(!j.ok)throw new Error(j.error||'서버 오류'); return j;
}
function norm(v){
  if(!v||!Array.isArray(v.items))return null;
  return {items:v.items.map(i=>Object.assign({start:'',end:'',title:'',place:'',note:'',mapUrl:''},i,{day:+i.day,groups:i.groups||[]})),travel:v.travel||{},notes:v.notes||{}};
}
function applyRemote(d){
  const v=norm(d); if(!v)return;
  const str=JSON.stringify(v); lastSync=Date.now();
  if(str===lastRemote)return;
  const first=!lastRemote; lastRemote=str; data=v; save();
  if($('#modal').classList.contains('hidden'))render();
  if(!first&&!editing)toast('🔄 일정이 업데이트됐어요','방금 수정된 내용이 반영됐어요.');
}
let pulling=false;
async function pull(){
  if(!remote||pulling)return; pulling=true;
  try{
    const r=await api(); needPin=r.needPin;
    if(!r.data.items.length){const r2=await api({action:'init',data:fresh()});applyRemote(r2.data)}  // 시트가 비었으면 기본 일정 업로드
    else applyRemote(r.data);
    syncState='online';
  }catch(e){syncState=navigator.onLine?'error':'offline';console.error(e)}
  pulling=false; renderSync();
}
// 수정: 먼저 화면에 반영하고 시트에 저장
async function commit(op,local){
  local(); save(); render();
  if(!remote)return;
  syncState='saving'; renderSync();
  try{const r=await api(Object.assign({pin:editPin},op)); lastRemote=''; applyRemote(r.data); syncState='online'}
  catch(e){alert('시트 저장 실패: '+e.message+'\n최신 일정을 다시 불러올게요.'); lastRemote=''; syncState='error'; pull()}
  renderSync();
}

/* ======================= 푸시 (Firebase) ======================= */
async function getPushToken(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error('이 브라우저는 푸시를 지원하지 않아요. (아이폰은 홈 화면에 추가 후 사용)');
  if(!location.protocol.startsWith('http'))throw new Error('푸시는 사이트를 인터넷 주소(https)로 열었을 때만 돼요.');
  const p=await Notification.requestPermission(); if(p!=='granted')throw new Error('알림 권한이 허용되지 않았어요.');
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  if(!window.firebase){await loadScript(V+'firebase-app-compat.js');await loadScript(V+'firebase-messaging-compat.js')}
  if(!firebase.apps.length)firebase.initializeApp(CONFIG.PUSH.firebase);
  const reg=swReg||await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  return firebase.messaging().getToken({vapidKey:CONFIG.PUSH.vapidKey,serviceWorkerRegistration:reg});
}
function subBody(token){return {action:'subscribe',token,cls:settings.cls||'',jin:settings.jin,course:settings.course,lead:settings.lead||0}}
async function togglePush(){
  if(settings.push){
    try{await api({action:'unsubscribe',token:settings.pushToken})}catch(e){}
    settings.push=false;settings.pushToken='';saveS();render();toast('📲 푸시 알림을 껐어요','');return;
  }
  try{
    toast('📲 푸시 설정 중…','잠시만 기다려 주세요.');
    const token=await getPushToken(); await api(subBody(token));
    settings.push=true;settings.pushToken=token;saveS();render();
    toast('✅ 푸시 알림 켜짐','사이트를 닫아도 일정 알림이 와요.');
  }catch(e){alert('푸시 알림을 켜지 못했어요.\n'+e.message)}
}
let subTimer=null;
function resyncPush(){ // 반·코스·미리알림이 바뀌면 서버 구독 정보 갱신
  if(!settings.push||!remote)return; clearTimeout(subTimer);
  subTimer=setTimeout(async()=>{try{const t=await getPushToken(); if(t!==settings.pushToken){settings.pushToken=t;saveS()} await api(subBody(t))}catch(e){console.error(e)}},800);
}

/* ======================= 이벤트 ======================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.cls!==undefined){settings.cls=+b.dataset.cls||null;saveS();render();resyncPush()}
  else if(b.dataset.jin){settings.jin=b.dataset.jin;saveS();render();resyncPush()}
  else if(b.dataset.course){settings.course=b.dataset.course;saveS();render();resyncPush()}
  else if(b.dataset.day){curDay=+b.dataset.day;render()}
  else if(b.dataset.act==='edit')itemModal(data.items.find(x=>x.id===b.dataset.id));
  else if(b.dataset.act==='add')itemModal(null);
  else if(b.dataset.act==='travel')travelModal(b.dataset.key);
  else if(b.dataset.lead!==undefined){settings.lead=+b.dataset.lead;saveS();render();resyncPush()}
  else if(b.dataset.act==='push')togglePush();
  else if(b.dataset.act==='testPush')api({action:'testPush',token:settings.pushToken}).then(()=>toast('📨 테스트 푸시를 보냈어요','잠시 후 알림이 와요. 사이트를 닫고 확인해 보세요.')).catch(e=>alert(e.message));
  else if(b.dataset.act==='copyTopic'){navigator.clipboard&&navigator.clipboard.writeText(ntfyTopic());toast('📋 복사했어요',ntfyTopic())}
  else if(b.dataset.act==='notify')toggleNotify();
  else if(b.dataset.act==='testNoti'){beep();notify('🔔 테스트 알림','이렇게 알림이 와요!')}
  else if(b.dataset.act==='ics')downloadICS();
  else if(b.dataset.act==='nolink')alert('아직 학교 사이트 주소가 등록되지 않았어요.\n파일 맨 위 CONFIG.LINKS 의 url 에 주소를 넣어 주세요.');
  else if(b.dataset.act==='note'){const v=prompt('이 날의 안내 메모',data.notes[curDay]??DAYS[curDay-1].note);if(v!==null){const d=curDay;commit({action:'setNote',day:d,note:v},()=>{data.notes[d]=v})}}
});
$('#editBtn').onclick=()=>{
  if(!editing&&remote&&needPin&&!editPin){
    const p=prompt('편집 비밀번호를 입력하세요'); if(p===null)return;
    api({action:'checkPin',pin:p}).then(()=>{editPin=p;sessionStorage.setItem('trip_pin',p);$('#editBtn').click()}).catch(e=>alert(e.message));
    return;
  }
  editing=!editing;document.body.classList.toggle('editing',editing);$('#editBtn').classList.toggle('on',editing);$('#editBtn').textContent=editing?'✅ 편집 완료':'✏️ 일정 편집';render()};
$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='수학여행일정_2026.json';a.click()};
$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;const nd={items:d.items,travel:d.travel||{},notes:d.notes||{}};commit({action:'replaceAll',data:nd},()=>{data=nd});alert('일정을 불러왔어요.')}catch(x){alert('올바른 일정 파일이 아니에요.')}};r.readAsText(f);e.target.value=''};
$('#resetBtn').onclick=()=>{if(confirm('수정한 내용과 링크를 모두 지우고 원래 일정으로 되돌릴까요?'+(remote?'\n⚠️ 구글 시트와 연결돼 있어 모든 사람의 일정이 초기화돼요.':''))){const nd=fresh();commit({action:'replaceAll',data:nd},()=>{data=nd})}};
$('#simInput').onchange=e=>{sim=e.target.value||null;const d=sim&&DAYS.find(x=>x.date===sim.slice(0,10));if(d)curDay=d.n;render();setTimeout(scrollCur,100)};
$('#simOff').onclick=()=>{sim=null;$('#simInput').value='';render()};

/* 시작 */
(function init(){
  const t=nowKST().date, d=DAYS.find(x=>x.date===t);
  curDay=d?d.n:(t>DAYS[3].date?4:1);
  render(); if(d)setTimeout(scrollCur,300);
  setInterval(()=>{if($('#modal').classList.contains('hidden'))render()},30000);
  checkAlarms(); setInterval(checkAlarms,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkAlarms();render()}});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});
  pull(); setInterval(()=>{if(!document.hidden)pull()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
  window.addEventListener('online',pull);
  if(settings.push)resyncPush();
})();
</script>
</body>
</html>
